version: "2"
sql:
  - engine: postgresql
    queries: ./db/queries
    schema: ./db/schema
    gen:
      go:
        package: db
        out: ./internal/db
        emit_json_tags: true
        sql_package: pgx/v5
        overrides:
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: numeric
            go_type: github.com/shopspring/decimal.Decimal
